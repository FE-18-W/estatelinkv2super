<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – EstateLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .thank-you-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .checkmark-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin-bottom: 1.5rem;
            animation: scaleIn 0.5s ease-out;
        }

        .checkmark-icon svg {
            width: 45px;
            height: 45px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            animation: checkAnimation 0.6s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes checkAnimation {
            from {
                stroke-dashoffset: 60;
                stroke-dasharray: 60;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #2d3436;
        }

        .message {
            color: #636e72;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .login-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 0.8rem;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .login-btn:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .countdown {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <div class="checkmark-icon">
            <svg viewBox="0 0 24 24">
                <path d="M20 6L9 17l-5-5" stroke-dasharray="60" stroke-dashoffset="60"/>
            </svg>
        </div>
        <h1>Thank You!</h1>
        <p class="message">
            We appreciate your time on EstateLink. Thank you for helping keep our estate community connected and engaged.
        </p>
        <a href="{% url 'login' %}" class="login-btn">Back to Login</a>
        <p class="countdown">You will be redirected in <span id="countdown">5</span> seconds...</p>
    </div>

    <script>
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            if (seconds === 0) {
                clearInterval(interval);
                window.location.href = "{% url 'login' %}";
            }
        }, 1000);
    </script>
</body>
</html>
