services:
  - type: web
    name: estatelink
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: estatelink-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://estatelink.onrender.com"

databases:
  - name: estatelink-db
    databaseName: estatelink
    user: estatelink
