services:
  - type: web
    name: estatelink
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    releaseCommand: |
      python manage.py migrate
      python manage.py createsuperuser --no-input || true
      echo "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.create_superuser('felixm', 'felixochieng5785@gmail.com', '171630m@felix') if not User.objects.filter(username='felixm').exists() else None" | python manage.py shell
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: felixm
      - key: DJANGO_SUPERUSER_EMAIL
        value: felixochieng5785@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: 171630m@felix
      - key: DATABASE_URL
        fromDatabase:
          name: estatelink-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://estatelink.onrender.com"

databases:
  - name: estatelink-db
    databaseName: estatelink
    user: estatelink